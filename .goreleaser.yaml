# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/github-actions/main.go
    binary: action
archives:
  - formats: [binary]
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
snapshot:
  name_template: "SNAPSHOT-{{ .ShortCommit }}"
release:
  github:
    owner: dictybase-docker
    name: github-actions
